spring.application.name=moh-backend

# Local secrets (DB, JWT, mail) from MOH_Connect_Backend/.env; not in git. See .env.example.
# Run the backend from the MOH_Connect_Backend folder so this file is found.
spring.config.import=optional:file:.env[.properties]
#ubalge backend eka run wena port eka gaha gnna
server.port= 8082
server.servlet.context-path=/api/v1/moh-backend



server.error.include-message = always

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.ttl-millis=86400000

# ===============================
# Email Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_USERNAME:no-reply@moh.gov.lk}

# ===============================
# Frontend (used in password reset links)
# ===============================
app.frontend.base-url=http://localhost:3000
